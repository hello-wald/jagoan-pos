apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: analytics
          image: jagoan-pos/analytics:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: tcp
              containerPort: 4005
          envFrom:
            - configMapRef:
                name: service-config
            - secretRef:
                name: analytics-env
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: tcp
            initialDelaySeconds: 10
          livenessProbe:
            tcpSocket:
              port: tcp
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: analytics
spec:
  selector:
    app: analytics
  ports:
    - name: tcp
      port: 4005
      targetPort: tcp
  type: ClusterIP
