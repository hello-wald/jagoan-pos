apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-migrate
  namespace: jagoan-pos
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate
          image: jagoan-pos/reports-migrate:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: service-config
            - secretRef:
                name: reports-env
            - secretRef:
                name: outbox-env
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
