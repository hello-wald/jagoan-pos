apiVersion: v1
kind: ConfigMap
metadata:
  name: service-config
data:
  NODE_ENV: production
  LOG_LEVEL: info

  GATEWAY_PORT: "3000"
  CORE_HOST: core
  CORE_TCP_PORT: "4001"
  CORE_DATABASE_POOL_MAX: "5"
  JWT_EXPIRES_IN_SECONDS: "3600"

  PRODUCTS_HOST: products
  PRODUCTS_TCP_PORT: "4002"
  PRODUCTS_DATABASE_POOL_MAX: "5"
  PRODUCTS_STORAGE_BUCKET: product-images
  PRODUCT_IMAGE_MAX_BYTES: "5242880"
  PRODUCT_IMAGE_SIGNED_URL_TTL_SECONDS: "900"

  TRANSACTIONS_HOST: transactions
  TRANSACTIONS_TCP_PORT: "4003"
  TRANSACTIONS_DATABASE_POOL_MAX: "5"
  PRODUCTS_RPC_TIMEOUT_MS: "3000"

  REPORTS_HOST: reports
  REPORTS_TCP_PORT: "4004"
  CLICKHOUSE_QUERY_TIMEOUT_MS: "10000"

  ANALYTICS_HOST: analytics
  ANALYTICS_TCP_PORT: "4005"
  GEMINI_MODEL: gemini-3.5-flash-lite
  AI_MAX_TOOL_CALLS: "3"
  AI_MAX_MESSAGE_LENGTH: "2000"
  AI_MAX_RANGE_DAYS: "92"

  OUTBOX_DATABASE_POOL_MAX: "2"
  OUTBOX_POLL_INTERVAL_MS: "2000"
  OUTBOX_BATCH_SIZE: "100"
  OUTBOX_MAX_ATTEMPTS: "5"
  OUTBOX_MAX_BACKOFF_MS: "60000"
