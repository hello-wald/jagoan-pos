apiVersion: apps/v1
kind: Deployment
metadata:
  name: transactions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transactions
  template:
    metadata:
      labels:
        app: transactions
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: transactions
          image: jagoan-pos/transactions:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: tcp
              containerPort: 4003
          envFrom:
            - configMapRef:
                name: service-config
            - secretRef:
                name: transactions-env
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 600m
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: tcp
            initialDelaySeconds: 10
          livenessProbe:
            tcpSocket:
              port: tcp
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: transactions
spec:
  selector:
    app: transactions
  ports:
    - name: tcp
      port: 4003
      targetPort: tcp
  type: ClusterIP
