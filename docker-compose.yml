name: application-k

services:

  # ============================================================
  # PostgreSQL - Operational / Transactional Database
  # ============================================================

  postgres:
    image: postgres:17-alpine
    container_name: application-k-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-application_k}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  # ============================================================
  # ClickHouse - Analytical / OLAP Database
  # ============================================================

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: application-k-clickhouse

    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-app}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_dev_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1

    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client \
          --user $${CLICKHOUSE_USER} \
          --password $${CLICKHOUSE_PASSWORD} \
          --query 'SELECT 1'"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  # ============================================================
  # Redis - Cache + BullMQ
  # ============================================================

  redis:
    image: redis:8-alpine
    container_name: application-k-redis

    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-redis_dev_password}"
      ]

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a $${REDIS_PASSWORD:-redis_dev_password} ping | grep PONG"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  # ============================================================
  # NestJS - POS / Transactional API
  # ============================================================

  api:
    profiles: ["full"]

    build:
      context: .
      dockerfile: infra/docker/Dockerfile.nest
      args:
        APP_FILTER: "@app/api"

    container_name: application-k-api

    environment:
      NODE_ENV: production
      PORT: 3001

      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_dev_password}@postgres:5432/${POSTGRES_DB:-application_k}

      REDIS_URL: >-
        redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/0

    ports:
      - "${API_PORT:-3001}:3001"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped


  # ============================================================
  # NestJS - Reporting / Analytics / AI API
  # ============================================================

  insight-api:
    profiles: ["full"]

    build:
      context: .
      dockerfile: infra/docker/Dockerfile.nest
      args:
        APP_FILTER: "@app/insight-api"

    container_name: application-k-insight-api

    environment:
      NODE_ENV: production
      PORT: 3002

      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-app}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_dev_password}

      REDIS_URL: >-
        redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/0

    ports:
      - "${INSIGHT_API_PORT:-3002}:3002"

    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped


  # ============================================================
  # NestJS Standalone - Outbox Relay
  # ============================================================

  outbox-relay:
    profiles: ["full"]

    build:
      context: .
      dockerfile: infra/docker/Dockerfile.nest
      args:
        APP_FILTER: "@app/outbox-relay"

    container_name: application-k-outbox-relay

    environment:
      NODE_ENV: production

      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_dev_password}@postgres:5432/${POSTGRES_DB:-application_k}

      REDIS_URL: >-
        redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/0

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped


  # ============================================================
  # NestJS Standalone - Analytics Worker
  # ============================================================

  analytics-worker:
    profiles: ["full"]

    build:
      context: .
      dockerfile: infra/docker/Dockerfile.nest
      args:
        APP_FILTER: "@app/analytics-worker"

    container_name: application-k-analytics-worker

    environment:
      NODE_ENV: production

      REDIS_URL: >-
        redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/0

      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-app}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_dev_password}

    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

    restart: unless-stopped


  # ============================================================
  # Next.js
  # ============================================================

  web:
    profiles: ["full"]

    build:
      context: .
      dockerfile: infra/docker/Dockerfile.next

      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_INSIGHT_API_URL: ${NEXT_PUBLIC_INSIGHT_API_URL:-http://localhost:3002}

    container_name: application-k-web

    environment:
      NODE_ENV: production
      PORT: 3000

    ports:
      - "${WEB_PORT:-3000}:3000"

    depends_on:
      - api
      - insight-api

    restart: unless-stopped


# ==============================================================
# Persistent Volumes
# ==============================================================

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  redis_data: