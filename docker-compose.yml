name: jagoan-pos

# Production Compose for the GCE VM. The frontend is deployed separately to Vercel.
# Copy deploy/gcp/.env.example to deploy/gcp/.env and run:
# docker compose --env-file deploy/gcp/.env up -d

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      CADDY_EMAIL: ${CADDY_EMAIL:?CADDY_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/gcp/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api-gateway:
        condition: service_healthy
    networks: [backend]

  api-gateway:
    image: ${API_GATEWAY_IMAGE:?API_GATEWAY_IMAGE is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 3000
      CORE_HOST: core-service
      CORE_TCP_PORT: 4001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    expose:
      - "3000"
    depends_on:
      core-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [backend]

  core-service:
    image: ${CORE_IMAGE:?CORE_IMAGE is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CORE_HOST: 0.0.0.0
      CORE_TCP_PORT: 4001
      CORE_DATABASE_URL: ${CORE_DATABASE_URL:?CORE_DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:?UPSTASH_REDIS_REST_URL is required}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:?UPSTASH_REDIS_REST_TOKEN is required}
    expose:
      - "4001"
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
