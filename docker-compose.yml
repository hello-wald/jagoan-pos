name: jagoan-pos

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      CADDY_EMAIL: ${CADDY_EMAIL:?CADDY_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/gcp/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api-gateway:
        condition: service_healthy
    networks: [backend]

  api-gateway:
    image: ${API_GATEWAY_IMAGE:?API_GATEWAY_IMAGE is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 3000
      CORE_HOST: core
      CORE_TCP_PORT: 4001
      PRODUCTS_HOST: products
      PRODUCTS_TCP_PORT: 4002
      TRANSACTIONS_HOST: transactions
      TRANSACTIONS_TCP_PORT: 4003
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "3000"
    depends_on:
      core:
        condition: service_started
      products:
        condition: service_started
      transactions:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [backend]

  core:
    image: ${CORE_IMAGE:?CORE_IMAGE is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CORE_HOST: 0.0.0.0
      CORE_TCP_PORT: 4001
      CORE_DATABASE_URL: ${CORE_DATABASE_URL:?CORE_DATABASE_URL is required}
      CORE_DIRECT_URL: ${CORE_DIRECT_URL:?CORE_DIRECT_URL is required}
      CORE_DATABASE_POOL_MAX: ${CORE_DATABASE_POOL_MAX:-5}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "4001"
    networks: [backend]

  products:
    image: ${PRODUCTS_IMAGE:?PRODUCTS_IMAGE is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PRODUCTS_HOST: 0.0.0.0
      PRODUCTS_TCP_PORT: 4002
      PRODUCTS_DATABASE_URL: ${PRODUCTS_DATABASE_URL:?PRODUCTS_DATABASE_URL is required}
      PRODUCTS_DIRECT_URL: ${PRODUCTS_DIRECT_URL:?PRODUCTS_DIRECT_URL is required}
      PRODUCTS_DATABASE_POOL_MAX: ${PRODUCTS_DATABASE_POOL_MAX:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "4002"
    networks: [backend]

  transactions:
    image: ${TRANSACTIONS_IMAGE:?TRANSACTIONS_IMAGE is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TRANSACTIONS_HOST: 0.0.0.0
      TRANSACTIONS_TCP_PORT: 4003
      TRANSACTIONS_DATABASE_URL: ${TRANSACTIONS_DATABASE_URL:?TRANSACTIONS_DATABASE_URL is required}
      TRANSACTIONS_DIRECT_URL: ${TRANSACTIONS_DIRECT_URL:?TRANSACTIONS_DIRECT_URL is required}
      TRANSACTIONS_DATABASE_POOL_MAX: ${TRANSACTIONS_DATABASE_POOL_MAX:-5}
      # Checkout resolves catalog prices synchronously over TCP.
      PRODUCTS_HOST: products
      PRODUCTS_TCP_PORT: 4002
      PRODUCTS_RPC_TIMEOUT_MS: ${PRODUCTS_RPC_TIMEOUT_MS:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "4003"
    depends_on:
      products:
        condition: service_started
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
